name: Deploy Preview E2E

on:
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_TEST_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--thetracecrumb.netlify.app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Wait for exact Netlify PR preview
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location "$PLAYWRIGHT_TEST_BASE_URL/?demo=1&source_channel=ci-readiness" >/dev/null; then
              echo "Deploy Preview is reachable: $PLAYWRIGHT_TEST_BASE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Deploy Preview did not become reachable"
          exit 1
      - name: Install Playwright without changing repository lock state
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.62.0
          npx playwright install --with-deps chromium
          git diff --exit-code -- package.json package-lock.json || {
            echo "Browser-test setup changed repository dependency metadata"
            exit 1
          }
      - name: Run deployed-preview browser acceptance
        run: npx playwright test e2e/preview.spec.mjs --project=chromium
